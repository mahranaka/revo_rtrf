<!DOCTYPE html>
<html lang="en" class="bg-gray-950 text-gray-100">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guild Progress & Stream Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Twitch Interactive Player API -->
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
</head>
<body class="min-h-screen flex flex-col font-sans bg-gray-950">

    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between shadow-lg">
        <h1 class="text-2xl font-bold text-amber-400 tracking-wide">
            ⚔️ Race to World First — Live Tracker
        </h1>
        <div class="text-sm text-gray-400 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            Live Progress Sync
        </div>
    </header>

    <!-- Main Grid -->
    <main class="flex-1 p-4 md:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6 max-w-[1920px] mx-auto w-full">

        <!-- GUILD 1: Axon Terminal -->
        <section class="bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col gap-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <div>
                    <h2 class="text-xl font-bold text-amber-300">Axon Terminal</h2>
                    <p class="text-xs text-gray-400">EU – Tarren Mill | Streamer: March</p>
                </div>
                <a href="https://www.warcraftlogs.com/guild/progress/605355?zone=53" 
                   target="_blank" 
                   class="text-xs bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 border border-amber-500/40 px-3 py-1.5 rounded transition">
                   Full WCL Page ↗
                </a>
            </div>

            <!-- Twitch Video Stream Container -->
            <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden border border-gray-800">
                <div id="twitch-embed-march" class="w-full h-full"></div>
            </div>

            <!-- Custom Live Progress Widget -->
            <div id="widget-axon" class="bg-gray-950 rounded-lg border border-gray-800 p-4 flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Mythic Progress Overview</span>
                    <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded" id="status-axon">Syncing...</span>
                </div>
                <div class="grid grid-cols-2 gap-3" id="content-axon">
                    <div class="bg-gray-900 border border-gray-800 rounded p-3 text-center animate-pulse">
                        <div class="h-4 bg-gray-800 rounded w-1/2 mx-auto mb-2"></div>
                        <div class="h-6 bg-gray-800 rounded w-3/4 mx-auto"></div>
                    </div>
                    <div class="bg-gray-900 border border-gray-800 rounded p-3 text-center animate-pulse">
                        <div class="h-4 bg-gray-800 rounded w-1/2 mx-auto mb-2"></div>
                        <div class="h-6 bg-gray-800 rounded w-3/4 mx-auto"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- GUILD 2: Save The Wife -->
        <section class="bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col gap-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <div>
                    <h2 class="text-xl font-bold text-amber-300">Save The Wife</h2>
                    <p class="text-xs text-gray-400">EU – Twisting Nether | Streamer: Zheen & Venzer</p>
                </div>
                <a href="https://www.warcraftlogs.com/guild/id/767263" 
                   target="_blank" 
                   class="text-xs bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 border border-amber-500/40 px-3 py-1.5 rounded transition">
                   Full WCL Page ↗
                </a>
            </div>

            <!-- Twitch Video Stream Container -->
            <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden border border-gray-800">
                <div id="twitch-embed-zheen" class="w-full h-full"></div>
            </div>

            <!-- Custom Live Progress Widget -->
            <div id="widget-stw" class="bg-gray-950 rounded-lg border border-gray-800 p-4 flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Mythic Progress Overview</span>
                    <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded" id="status-stw">Syncing...</span>
                </div>
                <div class="grid grid-cols-2 gap-3" id="content-stw">
                    <div class="bg-gray-900 border border-gray-800 rounded p-3 text-center animate-pulse">
                        <div class="h-4 bg-gray-800 rounded w-1/2 mx-auto mb-2"></div>
                        <div class="h-6 bg-gray-800 rounded w-3/4 mx-auto"></div>
                    </div>
                    <div class="bg-gray-900 border border-gray-800 rounded p-3 text-center animate-pulse">
                        <div class="h-4 bg-gray-800 rounded w-1/2 mx-auto mb-2"></div>
                        <div class="h-6 bg-gray-800 rounded w-3/4 mx-auto"></div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script type="text/javascript">
        // Init Twitch Player
        const domains = [];
        if (window.location.hostname) {
            domains.push(window.location.hostname);
        }

        new Twitch.Player("twitch-embed-march", {
            width: "100%",
            height: "100%",
            channel: "marchosiases",
            parent: domains.length > 0 ? domains : ["localhost"]
        });

        new Twitch.Player("twitch-embed-zheen", {
            width: "100%",
            height: "100%",
            channel: "zheenzz",
            parent: domains.length > 0 ? domains : ["localhost"]
        });

        // Fetch Live Raid Progress from Raider.IO Open API
        async function fetchGuildData(region, realm, guildName, wclId, contentId, statusId) {
            const statusEl = document.getElementById(statusId);
            const contentEl = document.getElementById(contentId);

            // Strict 3-second controller timeout
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000);

            try {
                const encodedGuild = encodeURIComponent(guildName);
                const apiUrl = `https://raider.io/api/v1/guilds/profile?region=${region}&realm=${realm}&name=${encodedGuild}&fields=raid_progression`;

                const res = await fetch(apiUrl, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!res.ok) throw new Error("API response error");

                const data = await res.json();
                const raidKeys = Object.keys(data.raid_progression || {});
                const latestRaidKey = raidKeys.length > 0 ? raidKeys[raidKeys.length - 1] : null;

                if (latestRaidKey && data.raid_progression[latestRaidKey]) {
                    const prog = data.raid_progression[latestRaidKey];
                    statusEl.textContent = "Live Sync";
                    statusEl.className = "text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded";

                    contentEl.innerHTML = `
                        <div class="bg-gray-900 border border-gray-800 rounded p-3 text-center">
                            <span class="text-xs text-gray-400 block mb-1">Mythic Clearance</span>
                            <span class="text-lg font-bold text-amber-400">${prog.mythic_bosses_killed} / ${prog.total_bosses} M</span>
                        </div>
                        <a href="https://www.warcraftlogs.com/guild/progress/${wclId}" target="_blank" 
                           class="bg-gray-900 border border-gray-800 hover:border-amber-500/40 rounded p-3 text-center transition group flex flex-col justify-center">
                            <span class="text-xs text-gray-400 block mb-1 group-hover:text-amber-300">Warcraft Logs</span>
                            <span class="text-sm font-semibold text-gray-200 group-hover:text-amber-400">View Live Pulls ↗</span>
                        </a>
                    `;
                } else {
                    throw new Error("No raid progression data");
                }
            } catch (err) {
                // Fallback state if API fails or times out
                statusEl.textContent = "WCL Connected";
                statusEl.className = "text-xs bg-gray-800 text-gray-400 border border-gray-700 px-2 py-0.5 rounded";

                contentEl.innerHTML = `
                    <a href="https://www.warcraftlogs.com/guild/progress/${wclId}" target="_blank" class="col-span-2 bg-gray-900 border border-gray-800 hover:bg-gray-800 rounded p-3 text-center transition">
                        <span class="text-sm font-semibold text-amber-300">Open Live Progression & Pull Analytics ↗</span>
                    </a>
                `;
            }
        }

        // Run fetch on load
        fetchGuildData("eu", "tarren-mill", "Axon Terminal", 605355, "content-axon", "status-axon");
        fetchGuildData("eu", "twisting-nether", "Save The Wife", 767263, "content-stw", "status-stw");
    </script>
</body>
</html>
